<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAHDI SAOUANE — Mes liens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Amiri&display=swap">
<style>
:root{--bg1:#f6f1e7;--bg2:#e9e1d0;--ink:#1c1a16;--muted:#6b6455;--card:rgba(255,255,255,.65);--line:rgba(120,95,40,.25);--gold:#a67c1f;--gold2:#d8b04a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0d0d12;--bg2:#17141c;--ink:#f4efe3;--muted:#a79f8d;--card:rgba(255,255,255,.06);--line:rgba(216,176,74,.28);--gold:#d8b04a;--gold2:#f3dc92}}
:root[data-theme="dark"]{--bg1:#0d0d12;--bg2:#17141c;--ink:#f4efe3;--muted:#a79f8d;--card:rgba(255,255,255,.06);--line:rgba(216,176,74,.28);--gold:#d8b04a;--gold2:#f3dc92}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,rgba(216,176,74,.22),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:36px 18px 48px}
main{width:100%;max-width:440px;text-align:center}
.avatar{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold2));box-shadow:0 10px 40px rgba(166,124,31,.35)}
.avatar div{width:100%;height:100%;border-radius:50%;background:var(--bg1);display:grid;place-items:center;font:600 38px "Cormorant Garamond",serif;color:var(--gold);letter-spacing:2px}
h1{margin:0;font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:5px}
.rule{width:64px;height:1px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.bio{font:400 21px/1.7 Amiri,serif;color:var(--muted);margin:0 0 26px;direction:rtl}
.links{display:grid;gap:12px}
a.l{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s,border-color .2s,box-shadow .2s;text-align:left}
a.l:hover,a.l:focus-visible{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 10px 28px rgba(166,124,31,.22);outline:none}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1;min-width:0}.t b{display:block;font-weight:600;font-size:15px;letter-spacing:.3px}.t span{font-size:12.5px;color:var(--muted)}
.ar{color:var(--gold);font-size:18px}
.fb{background:#1877f2}.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#7b3fe4)}.tk{background:#111;border:1px solid #333}.wa{background:#25d366}.gm{background:#ea4335}
button.qr{margin-top:22px;width:100%;padding:15px;border-radius:16px;border:1px solid var(--gold);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;font:600 15px Inter,sans-serif;letter-spacing:.6px;cursor:pointer}
#qrbox{display:none;margin-top:16px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
#qrbox.show{display:block}
#qrimg{display:inline-block;background:#fff;padding:14px;border-radius:14px}
#qrimg img,#qrimg canvas{display:block;max-width:100%}
#url{width:100%;margin:14px 0 10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:13px Inter,sans-serif}
.small{font-size:12px;color:var(--muted);margin:0 0 12px}
button.dl{padding:11px 20px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:600 14px Inter,sans-serif;cursor:pointer}
footer{margin-top:30px;font-size:12px;color:var(--muted);letter-spacing:1px}
</style>
</head>
<body>
<main>
  <div class="avatar"><div>MS</div></div>
  <h1>MAHDI SAOUANE</h1>
  <div class="rule"></div>
  <p class="bio">صلي على سيدنا ونبينا وحبيبنا محمد ﷺ</p>

  <nav class="links">
    <a class="l" href="https://www.facebook.com/share/1FKGxKkBwY/" target="_blank" rel="noopener"><span class="ic fb"><svg viewBox="0 0 24 24"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V9H6.5v3.5H9V21h3.5v-8.5H15L15.5 9h-3V6.8c0-.5.3-.8.8-.8H15z"/></svg></span><span class="t"><b>Facebook</b><span>Suivre ma page</span></span><span class="ar">›</span></a>
    <a class="l" href="https://www.instagram.com/saouanemahdi?vrfl=cTM2eGF4MW5qMjgz" target="_blank" rel="noopener"><span class="ic ig"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg></span><span class="t"><b>Instagram</b><span>@saouanemahdi</span></span><span class="ar">›</span></a>
    <a class="l" href="https://www.tiktok.com/@mahdi.saouane?_r=1&amp;_t=ZS-9BM2AQ0Rj8e" target="_blank" rel="noopener"><span class="ic tk"><svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.3 2.4 1.9 4 4.5 4.2"/></svg></span><span class="t"><b>TikTok</b><span>@mahdi.saouane</span></span><span class="ar">›</span></a>
    <a class="l" href="https://wa.me/qr/BBFSKTZKOGN3O1" target="_blank" rel="noopener"><span class="ic wa"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4A8 8 0 1 1 8 18.8z"/><path d="M9 9c.5 2.5 2.5 4.5 6 6l1.2-1.4-2-1-.9.7c-.8-.4-1.6-1.2-2-2l.7-.9-1-2z"/></svg></span><span class="t"><b>WhatsApp</b><span>Discuter avec moi</span></span><span class="ar">›</span></a>
    <a class="l" href="mailto:mahdisaouane7@gmail.com"><span class="ic gm"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span><span class="t"><b>Gmail</b><span>mahdisaouane7@gmail.com</span></span><span class="ar">›</span></a>
  </nav>

  <button class="qr" id="toggle" type="button">Afficher mon code QR</button>
  <section id="qrbox">
    <div id="qrimg"></div>
    <input id="url" type="url" aria-label="Lien de la page" placeholder="https://…">
    <p class="small">Collez ici le lien public de cette page, puis le code se met à jour.</p>
    <button class="dl" id="dl" type="button">Télécharger le QR (PNG)</button>
  </section>

  <footer>© MAHDI SAOUANE</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var box=document.getElementById('qrbox'),holder=document.getElementById('qrimg'),input=document.getElementById('url'),btn=document.getElementById('toggle');
  var start=(location.protocol.indexOf('http')===0)?location.href.split('#')[0]:'';
  input.value=start;
  function draw(){
    holder.innerHTML='';
    var v=input.value.trim();
    if(!v){holder.textContent='Entrez le lien de la page';return;}
    try{new QRCode(holder,{text:v,width:512,height:512,correctLevel:QRCode.CorrectLevel.H});
      holder.querySelectorAll('canvas,img').forEach(function(e){e.style.width='220px';e.style.height='220px';});
    }catch(e){holder.textContent='Erreur de génération';}
  }
  btn.onclick=function(){box.classList.toggle('show');var s=box.classList.contains('show');btn.textContent=s?'Masquer le code QR':'Afficher mon code QR';if(s)draw();};
  input.oninput=draw;
  document.getElementById('dl').onclick=function(){
    var c=holder.querySelector('canvas');if(!c)return;
    var o=document.createElement('canvas');o.width=o.height=640;var x=o.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,640,640);x.drawImage(c,64,64,512,512);
    var a=document.createElement('a');a.download='mahdi-saouane-qr.png';a.href=o.toDataURL('image/png');a.click();
  };
})();
</script>
</body>
</html>
